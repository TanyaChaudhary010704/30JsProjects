<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="display">
      <h1></h1>
    </div>
    <div class="keypad">
      <div class="key" onclick="displayNum(event)">AC</div>
      <div class="key" onclick="displayNum(event)">DE</div>
      <div class="key" onclick="displayNum(event)">.</div>
      <div class="key" onclick="displayNum(event)">/</div>
      <div class="key num" onclick="displayNum(event)">7</div>
      <div class="key num" onclick="displayNum(event)">8</div>
      <div class="key num" onclick="displayNum(event)">9</div>
      <div class="key" onclick="displayNum(event)">*</div>
      <div class="key num" onclick="displayNum(event)">4</div>
      <div class="key num" onclick="displayNum(event)">5</div>
      <div class="key num" onclick="displayNum(event)">6</div>
      <div class="key" onclick="displayNum(event)">-</div>
      <div class="key num" onclick="displayNum(event)">1</div>
      <div class="key num" onclick="displayNum(event)">2</div>
      <div class="key num" onclick="displayNum(event)">3</div>
      <div class="key" onclick="displayNum(event)">+</div>
      <div class="key num" onclick="displayNum(event)">00</div>
      <div class="key num" onclick="displayNum(event)">0</div>
      <div class="key equal" onclick="displayNum(event)">=</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
