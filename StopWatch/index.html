<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop Watch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <p>00:00:00</p>
    <div class="btns">
      <button class="stop"><img src="images/stop.png" alt=""></button>
      <button class="play"><img src="images/start.png" alt=""></button>
      <button class="reset"><img src="images/reset.png" alt=""></button>
    </div>
    
    <script src="https://kit.fontawesome.com/d4b73298dc.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </div>
</body>
</html>
